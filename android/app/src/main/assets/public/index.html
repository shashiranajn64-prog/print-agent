        // 1. Proxy WebSocket to cleanly handle Vite HMR when HMR is disabled in cloud proxy
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          function ViteSafeWebSocket(url, protocols) {
            const isViteHmr = 
              protocols === 'vite-hmr' || 
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && (url.includes('token=') || url.includes('vite')));

            if (isViteHmr) {
              const target = new EventTarget();
              target.readyState = 1; // WebSocket.OPEN
              target.url = String(url);
              target.protocol = 'vite-hmr';
              target.bufferedAmount = 0;
              target.extensions = '';
              target.binaryType = 'blob';
              target.send = function() {};
              target.close = function() {};
              
              const originalAddEventListener = target.addEventListener.bind(target);
              target.addEventListener = function(type, listener, options) {
                originalAddEventListener(type, listener, options);
                if (type === 'open') {
                  setTimeout(function() {
                    const evt = new Event('open');
                    if (typeof target.onopen === 'function') target.onopen(evt);
                    target.dispatchEvent(evt);
                  }, 0);
                }
              };

              target.onopen = null;
              target.onclose = null;
              target.onerror = null;
              target.onmessage = null;

              return target;
            }

            return new NativeWebSocket(url, protocols);
          }

          ViteSafeWebSocket.prototype = NativeWebSocket.prototype;
          ViteSafeWebSocket.CONNECTING = 0;
          ViteSafeWebSocket.OPEN = 1;
          ViteSafeWebSocket.CLOSING = 2;
          ViteSafeWebSocket.CLOSED = 3;

          window.WebSocket = ViteSafeWebSocket;
        }

        // 2. Intercept any lingering console errors or unhandled rejections
        const origError = console.error;
        console.error = function(...args) {
          const msg = args.map(function(a) {
            return (a && a.message) || String(a || '');
          }).join(' ');
          if (msg.includes('WebSocket') || msg.includes('closed without opened') || msg.includes('[vite]')) {
            return;
          }
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          const msg = args.map(function(a) {
            return (a && a.message) || String(a || '');
          }).join(' ');
          if (msg.includes('WebSocket') || msg.includes('closed without opened') || msg.includes('[vite]')) {
            return;
          }
          origWarn.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason;
          const msg = (reason && reason.message) || String(reason || '');
          if (msg.includes('WebSocket') || msg.includes('closed without opened') || msg.includes('[vite]')) {
            event.preventDefault();
          }
        });

          const msg = (event && event.message) || '';
          if (msg.includes('WebSocket') || msg.includes('closed without opened') || msg.includes('[vite]')) {
            event.preventDefault();
          }
        });
      })();
