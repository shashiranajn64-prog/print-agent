<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="12 10"/>

  <!-- Printer Body Base -->
  <g filter="url(#shadow)">
    <!-- Main Printer Chasis -->
    <rect x="106" y="210" width="300" height="190" rx="36" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
    <rect x="120" y="224" width="272" height="162" rx="26" fill="#0f172a"/>

    <!-- Paper Output Slot -->
    <rect x="146" y="260" width="220" height="24" rx="12" fill="#0284c7" opacity="0.9"/>
    
    <!-- Status LED Lights -->
    <circle cx="160" cy="340" r="10" fill="#22c55e"/> <!-- Power / Online (Green) -->
    <circle cx="195" cy="340" r="10" fill="#38bdf8"/> <!-- Bluetooth / Data (Blue) -->
    <circle cx="230" cy="340" r="10" fill="#eab308"/> <!-- Paper Feed (Yellow) -->

    <!-- Feed Button -->
    <rect x="300" y="325" width="68" height="30" rx="15" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <text x="334" y="345" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#cbd5e1" text-anchor="middle">FEED</text>
  </g>

  <!-- Emerging Printed Paper (Receipt with zigzag tear) -->
  <path d="M 166 260 L 166 110 L 181 125 L 196 110 L 211 125 L 226 110 L 241 125 L 256 110 L 271 125 L 286 110 L 301 125 L 316 110 L 331 125 L 346 110 L 346 260 Z" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Receipt Content Lines -->
  <rect x="190" y="145" width="132" height="10" rx="4" fill="#0284c7"/>
  <rect x="190" y="166" width="90" height="6" rx="3" fill="#64748b"/>
  <rect x="190" y="180" width="115" height="6" rx="3" fill="#94a3b8"/>
  <rect x="190" y="195" width="132" height="4" fill="#cbd5e1"/>
  <rect x="190" y="208" width="70" height="12" rx="3" fill="#0f172a"/>
  <rect x="270" y="208" width="52" height="12" rx="3" fill="#22c55e"/>

  <!-- Realtime Lightning Bolt / Signal Badge -->
  <circle cx="396" cy="140" r="50" fill="url(#glow)"/>
  <path d="M 404 105 L 375 145 L 396 145 L 388 178 L 420 133 L 399 133 Z" fill="#ffffff"/>
  
  <!-- "SPA" Agent Initials -->
  <text x="256" y="445" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#38bdf8" text-anchor="middle" letter-spacing="4">SHASHI PRINT AGENT</text>
</svg>
