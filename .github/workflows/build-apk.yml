
name: Build Shashi Print Agent APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Web Application
        run: npm run build
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Initialize or Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found, adding android platform..."
            npx cap add android
          else
            echo "Android directory exists, syncing web assets..."
            npx cap sync android
          fi

      - name: Verify Android Project
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle -o -f android/app/build.gradle.kts
          chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release-apk/ShashiPrintAgent-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShashiPrintAgent-Android-APK
          path: release-apk/ShashiPrintAgent-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/ShashiPrintAgent-debug.apk
          name: Shashi Print Agent ${{ github.ref_name }}
          draft: false
          prerelease: false
